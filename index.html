<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Random Team Picker</title>
<style>
body{font-family:Arial;background:#eef2ff;padding:25px}
main{max-width:600px;margin:auto;background:white;padding:25px;border-radius:15px}
textarea,input{width:100%;padding:12px;box-sizing:border-box;margin:10px 0}
button{padding:12px 18px;background:#4f46e5;color:white;border:0;border-radius:7px;cursor:pointer}
.team{background:#e0e7ff;padding:15px;margin:10px 0;border-radius:8px}
</style>
</head>
<body>
<main>
<h1>Random Team Picker</h1>
<textarea id="names" rows="7" placeholder="Enter one participant per line"></textarea>
<input id="size" type="number" min="1" value="2" placeholder="Members per team">
<button onclick="generate()">Generate Teams</button>
<div id="result"></div>
</main>
<script>
function generate(){
 const names=[...new Set(document.getElementById("names").value
 .split(/\r?\n/).map(x=>x.trim()).filter(Boolean))];
 const size=Number(document.getElementById("size").value);
 const result=document.getElementById("result");
 if(names.length<2||size<1||!Number.isInteger(size)){
  result.textContent="Enter at least two names and a valid team size.";
  return;
 }
 for(let i=names.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [names[i],names[j]]=[names[j],names[i]];
 }
 result.innerHTML="";
 for(let i=0;i<names.length;i+=size){
  const team=document.createElement("div");
  team.className="team";
  const heading=document.createElement("h3");
  heading.textContent="Team "+(Math.floor(i/size)+1);
  const members=document.createElement("p");
  members.textContent=names.slice(i,i+size).join(", ");
  team.append(heading,members);
  result.appendChild(team);
 }
}
</script>
</body>
</html>
